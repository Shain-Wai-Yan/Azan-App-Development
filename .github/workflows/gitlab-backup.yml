name: Backup to GitLab

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror GitHub repository to GitLab
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail

          git clone --bare             "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             repo.git

          cd repo.git

          GITLAB_URL="https://gitlab.com/shainstudio/Azan-App-Development.git"
          AUTH="$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 | tr -d '\n')"

          echo "Syncing branches..."
          git -c http.extraHeader="Authorization: Basic $AUTH"             push --prune "$GITLAB_URL"             'refs/heads/*:refs/heads/*'

          echo "Syncing tags..."
          git -c http.extraHeader="Authorization: Basic $AUTH"             push --prune "$GITLAB_URL"             'refs/tags/*:refs/tags/*'
